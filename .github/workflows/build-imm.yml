name: "Build ImmortalWrt Installer ISO"

on:
  workflow_dispatch:

# 同一工作流同一分支只允许一个运行实例，新触发时自动取消旧的
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write  # 发布release需要写权限

jobs:
  build-release:
    name: "Build and Release"
    runs-on: "ubuntu-22.04"

    steps:
      - name: "Checking out git repository"
        uses: actions/checkout@v4
      
      - name: Set executable permissions
        run: |
          chmod +x ${{ github.workspace }}/imm.sh
          chmod +x ${{ github.workspace }}/supportFiles/immortalwrt/build.sh

      - name: "Build Image"
        run: |
          set -e  # 遇到错误立即退出
          echo "开始构建 ImmortalWrt 安装器..."
          ./imm.sh
          echo "构建完成！"

      - name: "Get ISO Version"
        run: |
          ISO_FILE=$(ls -1 output/immortalwrt-*.iso)
          ISO_NAME=$(basename "${ISO_FILE}")
          echo "ISO_NAME=${ISO_NAME}" >> $GITHUB_ENV
          echo "ISO 文件: ${ISO_FILE}"
          echo "Release tag: ${ISO_NAME}"

      - name: "Publish"
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ env.ISO_NAME }}
          name: ${{ env.ISO_NAME }}
          body_path: ${{ github.workspace }}/supportFiles/immortalwrt/info.md
          files: |
            output/immortalwrt-*.iso
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
