name: "Auto Rename Release"

on:
  release:
    types: [published, edited]

# 同一 Release 只允许一个运行实例，防止并发问题
concurrency:
  group: rename-release-${{ github.event.release.id }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rename-release:
    name: "Rename Release Tag and Title"
    runs-on: "ubuntu-22.04"

    steps:
      - name: "Rename Release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID="${{ github.event.release.id }}"
          CURRENT_TAG="${{ github.event.release.tag_name }}"
          REPO="${{ github.repository }}"

          echo "当前 tag: $CURRENT_TAG"

          # 只处理包含 .img.gz 的 Release，跳过 ISO 等 Release
          ASSET_NAME=$(gh api repos/$REPO/releases/$RELEASE_ID/assets --jq '.[0].name')

          if [[ -z "$ASSET_NAME" || "$ASSET_NAME" == "null" ]]; then
            echo "Release 中没有 asset 文件，跳过重命名"
            exit 0
          fi

          if [[ "$ASSET_NAME" != *.img.gz ]]; then
            echo "Asset 文件名 $ASSET_NAME 不是 .img.gz 文件，跳过重命名"
            exit 0
          fi

          echo "Asset 文件名: $ASSET_NAME"

          # 直接使用文件名作为 tag/title
          # 例如 istoreos-24.10.1.img.gz -> istoreos-24.10.1.img.gz
          NEW_NAME="$ASSET_NAME"

          # 如果 tag 已经是目标名称，无需修改
          if [[ "$CURRENT_TAG" == "$NEW_NAME" ]]; then
            echo "tag 已经是目标名称，无需修改"
            exit 0
          fi

          echo "重命名: $CURRENT_TAG -> $NEW_NAME"

          # 更新 Release 的 tag_name 和 name
          gh api repos/$REPO/releases/$RELEASE_ID \
            -X PATCH \
            -f tag_name="$NEW_NAME" \
            -f name="$NEW_NAME"

          echo "Release 已重命名: $CURRENT_TAG -> $NEW_NAME"
