name: "Build iStoreOS Installer ISO"

on:
  workflow_dispatch:

# 防止同一时间运行多个相同工作流
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # 发布release需要写权限

jobs:
  build-release:
    name: "Build and Release"
    runs-on: "ubuntu-22.04"

    steps:

      - name: "Checking out git repository"
        uses: actions/checkout@v4
      
      - name: Set executable permissions
        run: |
          chmod +x ${{ github.workspace }}/istoreos.sh
          chmod +x ${{ github.workspace }}/supportFiles/istoreos/build.sh

      - name: Cache Docker images
        uses: actions/cache@v4
        with:
          path: ~/.docker
          key: ${{ runner.os }}-docker-base-${{ hashFiles('*.sh') }}
          restore-keys: |
            ${{ runner.os }}-docker-base-

      - name: "Build iStoreOS Installer ISO"
        run: |
          set -e  # 遇到错误立即退出
          echo "开始构建 iStoreOS 安装器..."
          ./istoreos.sh
          echo "构建完成！"
      
      - name: "Publish"
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: istoreos.iso
          body_path: ${{ github.workspace }}/supportFiles/istoreos/info.md
          files: |
            output/istoreos-*.iso
          token: ${{ secrets.GITHUB_TOKEN }}
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
